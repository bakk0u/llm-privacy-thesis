<svg xmlns="http://www.w3.org/2000/svg" width="440" height="610" viewBox="0 0 440 610" role="img" aria-labelledby="title"><title id="title">Telematics Privacy Study — Operational utility. Measured disclosure.</title><defs><linearGradient id="spectrum"><stop stop-color="#438cff"/><stop offset=".6" stop-color="#ff69c8"/><stop offset="1" stop-color="#ffe46b"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.orbit{animation:orbit 20s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.draw{stroke-dasharray:500;animation:draw 8s ease-in-out infinite}.flow{stroke-dasharray:5 13;animation:flow 6s linear infinite}.slide{animation:slide 8s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}@keyframes draw{0%{stroke-dashoffset:500}70%,100%{stroke-dashoffset:0}}@keyframes flow{to{stroke-dashoffset:-144}}@keyframes slide{0%,15%,100%{transform:translateX(0)}50%,70%{transform:translateX(64px)}}@media(prefers-reduced-motion:reduce){.orbit,.pulse,.draw,.flow,.slide{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}</style><rect x="1" y="1" width="438" height="608" rx="22" fill="#070b18" stroke="#26374f"/><text x="28" y="38" font-size="11" fill="#ffe46b" font-weight="700">EMPIRICAL STUDY / STRUCTURED PROMPTING</text><text x="28" y="100" font-size="39" fill="#eff5ff" font-weight="700">Telematics</text><text x="28" y="149" font-size="39" fill="#eff5ff" font-weight="700">Privacy Study</text><text x="28" y="198" font-size="20" fill="#ffe46b" font-weight="400">Operational utility.</text><text x="28" y="229" font-size="20" fill="#ffe46b" font-weight="400">Measured disclosure.</text><g transform="translate(65 306) scale(0.99)"><rect x="12" y="70" width="175" height="78" rx="15" fill="#070b18" stroke="#ffe46b"/><path d="M40 70l22 -38h70l25 38" fill="none" stroke="#ffe46b" stroke-width="2" class=""/><circle cx="48" cy="151" r="16" fill="#070b18" stroke="#ffe46b"